name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run self-test
        run: python3 scripts/community.py selftest
      - name: Check repository
        run: python3 scripts/community.py check
